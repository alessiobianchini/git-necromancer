[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-necromancer"
version = "0.1.0"
description = "The Open-Source Séance Engine for Dead Code, Abandoned Branches, and Repo Graveyards"
readme = "README.md"
authors = [{ name = "Alessio Bianchini", email = "alessio.bianchini@doit.it" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "rich>=13.7.1",
    "requests>=2.31.0",
    "sentry-sdk>=2.0.0",
]

[project.scripts]
git-necromancer = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
